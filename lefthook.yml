# lefthook.yml — git hook configuration for mdlinkcheck
#
# Hooks run locally before commits and pushes to catch issues before CI.
#
# ── CI coverage: exact accounting of all 9 ci.yml jobs ───────────────────────
#
# BI-083 correction.  This header previously claimed these hooks "run 4 of the
# 9 ci.yml jobs" with commands matching "flag-for-flag".  That became FALSE at
# 46cab5a, when the "Test (macos-latest)" job gained a SECOND substantive step
# (the POL-11 positive-coverage assertion) that no hook runs.  Truthful count,
# re-verified command-by-command against ci.yml on 2026-08-11:
#
#   FULLY mirrored (3 of 9) — command byte-identical to the CI step:
#     Format check              ← pre-commit/fmt     (cargo fmt --all --check)
#     Clippy (deny warnings)    ← pre-commit/clippy  (identical flags)
#     Purity check (ADR-001)    ← pre-push/purity    (`just purity`; the CI job
#                                  inlines the same script — FORBIDDEN_RE is
#                                  byte-identical between justfile and ci.yml)
#
#   PARTIALLY mirrored (1 of 9):
#     Test (macos-latest)       ← pre-push/test
#       That CI job has TWO substantive steps: "Run tests" and "POL-11
#       positive-coverage assertion".  The hook runs the first one, identically
#       (`cargo nextest run --locked --all-targets`), and does NOT run the POL-11
#       assertion.  See the POL-11 note below — this is deliberate, not an
#       oversight, but it does mean a POL-11 violation is INVISIBLE at pre-push
#       and will first surface in CI.
#
#   NOT covered (5 of 9):
#     Build release (macos-latest), MSRV check (1.88), Spec lint,
#     VEF selftest suite, Verify evidence figures (advisory).
#
# ── Why pre-push does NOT run the POL-11 assertion ───────────────────────────
#
# POL-11's remit in the frozen architecture spec is explicitly CI:
# tooling-selection.md introduces it as "**CI positive-coverage assertion
# (POL-11)**".  A git hook is not CI, so the policy is satisfied by its two
# CI-side sites — the `test` job in ci.yml and the `test` recipe in the justfile
# (the local CI mirror, invoked by `just ci`).  Adding it here would extend a
# frozen policy beyond its literal scope and would change what this hook does;
# that requires an operator ruling, not an editorial decision.
#
# ACCEPTED RESIDUAL (disclosed at the wave-1 gate): because the hook stops at
# `cargo nextest run`, a silent test-binary drop — the exact failure POL-11
# exists to catch, and a live risk here since global_gitignore_test.rs is a
# `harness = false` binary carrying BC-2.01.003 postconditions 2 and 3 alone —
# is not caught locally at pre-push.  Run `just test` (not the bare nextest
# command) or `just ci` to get the assertion locally.
#
# Pre-commit hooks are kept fast (< 30s); pre-push adds the test suite and the
# ADR-001 purity gate.  purity is included in pre-push because ADR-001 is a
# MANDATORY boundary rule for the 7 downstream stories and the check is cheap
# (grep over a small crate).
#
# Install: lefthook install
# Skip a hook: LEFTHOOK=0 git commit
# Skip one hook: lefthook run pre-push --skip lint
#
# Prerequisites: lefthook, cargo, cargo-nextest
#   brew install lefthook
#   or: cargo install lefthook --locked

# ─────────────────────────────────────────────────────────────────
# pre-commit: fast checks (< 30 seconds)
#   - Format check  [mirrors CI job "Format check"]
#   - Clippy lint   [mirrors CI job "Clippy (deny warnings)"]
#
# These run on every commit to catch trivial issues early.
# They do NOT run the full test suite (that's pre-push).
# ─────────────────────────────────────────────────────────────────
pre-commit:
  parallel: false
  commands:
    fmt:
      name: Format check
      run: cargo fmt --all --check
      stage_fixed: false

    clippy:
      name: Clippy (deny warnings)
      run: cargo clippy --locked --all-targets --all-features -- -D warnings
      stage_fixed: false

# ─────────────────────────────────────────────────────────────────
# pre-push: test suite + purity gate
#   - Test suite (nextest)  [mirrors the "Run tests" STEP of CI job
#                            "Test (macos-latest)" — NOT the whole job; that
#                            job also runs the POL-11 assertion, which this
#                            hook does not.  See the header for the accounting.]
#   - Purity (ADR-001)      [mirrors CI job "Purity check (ADR-001)"]
#
# Runs before any push.  This is the final local gate before CI, but it is NOT
# a superset of the required CI checks — see the coverage accounting above.
# Takes ~1 minute for a clean build.
# ─────────────────────────────────────────────────────────────────
pre-push:
  parallel: false
  commands:
    test:
      name: Test suite (nextest)
      # Mirrors the "Run tests" step only.  Deliberately does NOT include the
      # POL-11 positive-coverage assertion (POL-11's spec remit is CI; see
      # header).  Run `just test` for the assertion as well.
      run: cargo nextest run --locked --all-targets

    purity:
      name: Purity check (ADR-001)
      run: just purity
