# cargo-deny configuration for mdlinkcheck
#
# Enforces: license policy, security advisories, crate bans, and source policy.
# Run locally: cargo deny check
# Run in CI:   just deny  (hardening pipeline)
#
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# Schema: cargo-deny 0.19.0 (CI-pinned version)

[graph]
# Check all feature combinations to catch transitive deps that only appear
# under specific feature flags.  Target coverage uses the cargo-deny default
# (host target); extend via `targets = [...]` if cross-platform coverage is
# needed in a future story.
all-features = true

# ─────────────────────────────────────────────────────────────────
# Licenses
# ─────────────────────────────────────────────────────────────────
[licenses]
# Confidence threshold for license detection (SPDX matching).
confidence-threshold = 0.8

# Allow these SPDX license expressions.  Any license NOT in this list is
# implicitly denied (cargo-deny 0.17+ removed the explicit [licenses].deny
# key; the allow-list is now the complete policy boundary).
# Licenses denied by omission: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.0,
# LGPL-2.1, LGPL-3.0, SSPL-1.0, BSL-1.1 — original policy preserved.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]

# Per-crate license exceptions: allow a specific license for a single crate
# when that crate uses a license not in the workspace-wide allow list above.
# Format: { allow = ["LicenseExpr"], crate = "crate-name" }
exceptions = []

[licenses.private]
# Both mdlinkcheck and mdlinkcheck-core now declare `license = "MIT OR Apache-2.0"`
# in their [package] tables.  The LICENSE files (MIT and Apache-2.0 text) are not
# yet present in the repository — that is a human decision item for the operator,
# separate from the [package].license field.
#
# NOTE: `ignore = true` keys off the manifest `publish` field — a crate is
# "private" only if it sets `publish = false` (or `publish = []`).  Neither crate
# currently sets that field, so this stanza is effectively a no-op for the present
# workspace.  It is retained so that any future `publish = false` crate added to
# the workspace is automatically exempted from license checks.
ignore = true

# ─────────────────────────────────────────────────────────────────
# Security advisories (RustSec database)
# ─────────────────────────────────────────────────────────────────
[advisories]
# Path to a local clone of the advisory database.
# If empty, cargo-deny fetches it from GitHub.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Known acceptable advisories (empty — deny all unless explicitly noted here).
# Vulnerabilities are always hard errors in cargo-deny 0.19+.
# Yanked crates are denied by default in cargo-deny 0.19+.
ignore = []

# ─────────────────────────────────────────────────────────────────
# Crate bans
# ─────────────────────────────────────────────────────────────────
[bans]
# Warn on multiple versions of the same crate.  Deny when the project
# matures and the dependency graph stabilizes.
multiple-versions = "warn"

# Deny wildcard dependencies (security risk).
wildcards = "deny"

# Ban these crates entirely.
deny = [
    # Avoid old openssl-based crates in favor of rustls.
    # PackageSpec format: `{ crate = "name" }` (cargo-deny 0.14+ canonical form).
    { crate = "openssl-sys" },
    # Avoid unmaintained chrono; use time or jiff instead.
    # (Uncomment if chrono appears transitively.)
    # { crate = "chrono" },
]

# Allow specific duplicate version pairs that can't be resolved yet.
skip = []
skip-tree = []

# ─────────────────────────────────────────────────────────────────
# Source policy
# ─────────────────────────────────────────────────────────────────
[sources]
# Deny crates from unknown registries.
unknown-registry = "deny"

# Deny crates from unknown git sources.
unknown-git = "deny"

# Only allow crates from crates.io.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Explicitly allow git sources only if needed (empty = none allowed).
allow-git = []
