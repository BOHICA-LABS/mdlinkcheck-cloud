# cargo-deny configuration for mdlinkcheck
#
# Enforces: license policy, security advisories, crate bans, and source policy.
# Run locally: cargo deny check
# Run in CI:   just deny  (hardening pipeline)
#
# Reference: https://embarkstudios.github.io/cargo-deny/
#
# Schema: cargo-deny 0.17+ (incompatible with pre-0.16 advisory severity fields)

[graph]
# Check all features and targets to catch transitive deps that only appear
# under specific feature flags or platform conditions.
all-features = true

# ─────────────────────────────────────────────────────────────────
# Licenses
# ─────────────────────────────────────────────────────────────────
[licenses]
# Confidence threshold for license detection (SPDX matching).
confidence-threshold = 0.8

# Allow these SPDX license expressions.  Any license NOT in this list is
# implicitly denied (cargo-deny 0.17+ removed the explicit [licenses].deny
# key; the allow-list is now the complete policy boundary).
# Licenses denied by omission: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.0,
# LGPL-2.1, LGPL-3.0, SSPL-1.0, BSL-1.1 — original policy preserved.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]

# Per-crate license exceptions: allow a specific license for a single crate
# when that crate uses a license not in the workspace-wide allow list above.
# Format: { allow = ["LicenseExpr"], crate = "crate-name" }
exceptions = []

[licenses.private]
# Ignore workspace crates that have not yet been published to any registry.
# mdlinkcheck and mdlinkcheck-core are at 0.1.0 development stage and carry
# no license declaration yet — operator must add one before publishing.
# Remove this when a LICENSE file and [package].license fields are added.
ignore = true

# ─────────────────────────────────────────────────────────────────
# Security advisories (RustSec database)
# ─────────────────────────────────────────────────────────────────
[advisories]
# Path to a local clone of the advisory database.
# If empty, cargo-deny fetches it from GitHub.
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Scope of unmaintained-crate checks: "none" mirrors the original "warn"
# (non-blocking) intent from the pre-0.17 schema.  Upgrade to "workspace"
# or "all" when ready to enforce this as a hard gate.
unmaintained = "none"

# Known acceptable advisories (empty — deny all unless explicitly noted here).
# Vulnerabilities are always hard errors in cargo-deny 0.17+.
# Yanked crates are denied by default in cargo-deny 0.17+.
ignore = []

# ─────────────────────────────────────────────────────────────────
# Crate bans
# ─────────────────────────────────────────────────────────────────
[bans]
# Warn on multiple versions of the same crate.  Deny when the project
# matures and the dependency graph stabilizes.
multiple-versions = "warn"

# Deny wildcard dependencies (security risk).
wildcards = "deny"

# Ban these crates entirely.
deny = [
    # Avoid old openssl-based crates in favor of rustls.
    { name = "openssl-sys" },
    # Avoid unmaintained chrono; use time or jiff instead.
    # (Uncomment if chrono appears transitively.)
    # { name = "chrono" },
]

# Allow specific duplicate version pairs that can't be resolved yet.
skip = []
skip-tree = []

# ─────────────────────────────────────────────────────────────────
# Source policy
# ─────────────────────────────────────────────────────────────────
[sources]
# Deny crates from unknown registries.
unknown-registry = "deny"

# Deny crates from unknown git sources.
unknown-git = "deny"

# Only allow crates from crates.io.
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

# Explicitly allow git sources only if needed (empty = none allowed).
allow-git = []
