[package]
name = "mdlinkcheck"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mdlinkcheck"
path = "src/main.rs"

[dependencies]
mdlinkcheck-core = { path = "../mdlinkcheck-core" }
ignore = "0.4.33"
clap = { version = "4.6.5", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
proptest = "1.6"
tempfile = "3"
