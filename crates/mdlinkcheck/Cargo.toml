[package]
name = "mdlinkcheck"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[[bin]]
name = "mdlinkcheck"
path = "src/main.rs"

[dependencies]
mdlinkcheck-core = { path = "../mdlinkcheck-core", version = "0.1.0" }
ignore = "0.4.33"
clap = { version = "4.6.5", features = ["derive"] }
rayon = "1.12.0"

[dev-dependencies]
proptest = "1.6"
tempfile = "3"

[[test]]
name = "global_gitignore_test"
harness = false
