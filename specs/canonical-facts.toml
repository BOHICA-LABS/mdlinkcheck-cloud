# ── FACT-10: config_error membership and routing ──────────────────────────────
#
# Ruling: config_error = true has exactly ONE trigger: invalid --ignore glob
# pattern. Unrecognized flags handled by clap before app::run(); never reach
# verdict::exit_code. Routing is THROUGH verdict::exit_code (not process::exit).
#
# BI-042 D-076 remediation: all 7 patterns now use line-bounded wildcards
# terminated by per-site right delimiters. The canonical value is not embedded
# in any capture group.
#
# Binding 25: \( left-anchors to the CAP-014 parenthetical (not changelog entry
#   at pos 720 which lacks the opening paren). Right delimiter: ' pattern,'
# Binding 26: `config_error = true` left anchor avoids io_errors "receives:" at
#   pos 12810. Right delimiter: ' pattern '
# Binding 27: line-end capture ([^\n]+) terminated by \n (line 257 ends at "glob").
# Binding 28: right delimiter ' (' (opening paren of sole-trigger qualifier).
# Bindings 29,31: right delimiter ' pattern was detected' (noun phrase follows).
# Binding 30: right delimiter ' pattern \(' (parenthesized qualifier follows).
#
# Adversarial validation (ALL PASS):
#   Real "(sole trigger: invalid `--ignore` glob pattern, ..." → "invalid `--ignore` glob"
#   Adv "(sole trigger: invalid `--output` glob pattern, ..."  → captured, ≠ canonical → DIVERGE
#   Adv "(sole trigger: invalid --ignore glob pattern, ..."    → captured, ≠ canonical → DIVERGE
#   Real "startup configuration error is an invalid `--ignore` glob\n" → "invalid `--ignore` glob"
#   Adv "startup configuration error is an invalid `--ignore` glob or bad path\n" → captured, ≠ canonical → DIVERGE

[[fact]]
id              = "FACT-10"
description     = "config_error = true has exactly one trigger: invalid --ignore glob pattern (detected by globset after clap parsing; routed through verdict::exit_code)"
canonical_value = 'invalid `--ignore` glob'
source          = ".factory/specs/domain-spec/capabilities.md:241"

[[binding]]
