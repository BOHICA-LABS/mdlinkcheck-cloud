# canonical-facts.toml — spec topology remediation (BI-012)
# =============================================================
# THIS FILE IS THE SINGLE SOURCE OF TRUTH FOR CANONICAL VALUES.
# DO NOT hand-edit the [[fact]] canonical_value fields.
# If a restatement site diverges, fix THAT SITE — not this file.
# Checked by: scripts/spec-lint/check-canonical-facts.py
# Generated by: scripts/spec-lint/gen-bc-traceability.py (bc-arch-module)
#               scripts/spec-lint/gen-slug-corpus.py      (slug-corpus, slug-sequence-tests)
#
# Format
# ------
# [[fact]]     — canonical fact definition
# [[binding]]  — a restatement site that must match its fact's canonical_value
#
# Each [[binding]] MUST include a `pattern` field with exactly one regex
# capture group (group 1). The checker asserts:
#   re.search(pattern, file_text, re.DOTALL).group(1) == canonical_value
#
# Use TOML literal strings (single-quoted) for pattern values so backslashes
# are literal (no double-escaping needed for regex metacharacters).
#
# BI-042 D-076 remediation (2026-08-07): all 26 tautological patterns replaced
# with bounded-wildcard patterns. Capture group is now a wildcard terminated
# by a reliable right-side delimiter; the canonical value is never embedded
# in the capture group. This closes the prefix-extension false-negative class.

