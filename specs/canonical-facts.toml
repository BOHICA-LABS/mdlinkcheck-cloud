# Pattern captures the WHOLE platform clause up to the " (" terminator.
# Canonical value "macOS" matches only when macOS is the entire declared matrix.
# False-pass closure: "macOS and Linux" → group(1)="macOS and Linux" ≠ "macOS";
#   "macOS, Linux, Windows" → group(1)="macOS, Linux, Windows" ≠ "macOS";
#   "macOS and Windows (D-043)" → group(1)="macOS and Windows" ≠ "macOS".
# BI-023 first-token weakness eliminated.

[[fact]]
