# CI pipeline for mdlinkcheck
#
# Runs on:
#   - Push to feature/**, fix/**, develop, main branches
#   - Pull requests targeting develop or main
#   - Manual dispatch (workflow_dispatch) for check-name validation runs
#
# Platform target per D-043 (operator directive, 2026-08-06):
#   macos-latest only — product targets macOS exclusively.
#   Platform-independent jobs (fmt, lint, spec-lint) remain on ubuntu-latest
#   for cost efficiency (~10x cheaper than macOS runners).
#
# All action versions pinned to full commit SHAs (supply-chain security).
# SHA verification command: gh api repos/OWNER/REPO/git/refs/tags/TAG
#
# SHA inventory (verify before enabling remote CI):
#   actions/checkout     v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
#   Swatinem/rust-cache  v2.7.5  82a92a6e8fbeee089604da2575dc567ae9ddeaab

name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    # Manual trigger for validation runs (e.g. to capture exact check-run names
    # before adding them to branch-protection required-status-checks).

# Cancel in-progress runs on PRs; keep all runs on branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: only read the source tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Format check (fast gate, no caching needed)
  # Local equivalent: just fmt-check
  # ─────────────────────────────────────────────────────────────────
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard — skip if no Cargo workspace
        id: guard
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — workspace not yet scaffolded, skipping."
          fi

      - name: Check formatting
        if: steps.guard.outputs.skip != 'true'
        run: cargo fmt --all --check

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Clippy (deny all warnings)
  # Local equivalent: just lint
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard — skip if no Cargo workspace
        id: guard
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — workspace not yet scaffolded, skipping."
          fi

      - name: Restore Cargo cache
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      - name: Clippy
        if: steps.guard.outputs.skip != 'true'
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Tests — macOS-only per D-043
  # Local equivalent: just test
  #
  # D-043 (2026-08-06): product targets macOS exclusively.
  # Prior D-006 three-platform matrix (ubuntu/macos/windows) retired.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard — skip if no Cargo workspace
        id: guard
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — workspace not yet scaffolded, skipping."
          fi

      - name: Restore Cargo cache
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: test-macos-latest

      - name: Install cargo-nextest
        if: steps.guard.outputs.skip != 'true'
        # Installed via cargo install so no action SHA is needed.
        # Cached by Swatinem/rust-cache (it caches ~/.cargo/bin).
        # Pin version here to keep reproducible builds.
        run: cargo install cargo-nextest --locked --version 0.9.98
        env:
          # Skip building nextest from scratch if the binary is already in cache.
          CARGO_TERM_COLOR: always

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: cargo nextest run --all-targets

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Release build — macOS-only per D-043
  # Local equivalent: just build-release
  #
  # Verifies the binary links and compiles without errors on macOS.
  # Runs only after fmt + lint pass (avoids wasted runner-minutes).
  # D-043 (2026-08-06): prior ubuntu/windows matrix entries retired.
  # ─────────────────────────────────────────────────────────────────
  build-release:
    name: Build release (macos-latest)
    needs: [fmt, lint]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard — skip if no Cargo workspace
        id: guard
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — workspace not yet scaffolded, skipping."
          fi

      - name: Restore Cargo cache
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: release-macos-latest

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: cargo build --release

  # ─────────────────────────────────────────────────────────────────
  # Job 5: Spec lint — validate spec artifact integrity (no Cargo needed)
  # Local equivalent: just spec-lint
  #
  # Pure-Python validators that require only the .factory/specs/ tree.
  # Runs independently of all Rust jobs so it works before the
  # workspace is scaffolded.  Failures are violations that MUST be
  # fixed before the Phase 1 gate passes.
  #
  # Covered policies: POL-7, POL-12, POL-13, POL-14, POL-15,
  #                   POL-16, POL-17, POL-18, POL-19
  # ─────────────────────────────────────────────────────────────────
  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions: read-only source tree access.
    # Overrides workflow default to make the grant explicit per POL-11.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Checkout spec artifacts (factory-artifacts orphan branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: factory-artifacts
          path: .factory
          persist-credentials: false
          fetch-depth: 1

      - name: Run spec validators
        shell: bash
        run: |
          set -euo pipefail
          CHECKS=(
            "check-title-sync"
            "check-ec-injectivity"
            "check-id-resolution"
            "check-counts"
            "check-placeholders"
            "check-holdout-boundary"
            "check-adr-consistency"
            "check-index-integrity"
            "check-canonical-facts"
          )
          FAILURES=0
          for check in "${CHECKS[@]}"; do
            echo "── ${check} ──"
            ret=0
            python3 "scripts/spec-lint/${check}.py" || ret=$?
            case $ret in
              0)
                echo "  PASS" ;;
              2)
                echo "  ERROR (infrastructure — required input files missing)"
                FAILURES=$((FAILURES + 1)) ;;
              *)
                echo "  FAIL (spec violation found)"
                FAILURES=$((FAILURES + 1)) ;;
            esac
            echo ""
          done
          if [ "${FAILURES}" -gt 0 ]; then
            echo "spec-lint FAILED: ${FAILURES}/${#CHECKS[@]} checks failed"
            exit 1
          fi
          echo "spec-lint passed: all ${#CHECKS[@]} checks clean"

      # ── B2-1 / S2-3: VEF selftest suite ──────────────────────────────────────
      # Runs test-vef.py as an independent CI step.  Closes S2-3 (nothing ran
      # the suite in CI before this fix).  NOT continue-on-error: failure here
      # means the verifier itself is broken.
      # if: !cancelled() so it runs even when the prior spec-lint validators
      # exit 1 (tracked develop failures that this PR must not fix).
      - name: VEF selftest suite (test-vef.py)
        if: ${{ !cancelled() }}
        shell: bash
        run: python3 scripts/tests/test-vef.py

      # ── Advisory: evidence-figure verifier (SUGGESTION-6) ─────────────────
      # verify-evidence-figures.py is NOT a required status check (branch
      # protection change is operator-gated per D-120).  continue-on-error
      # ensures the spec-lint job result is unaffected by this advisory step.
      #
      # B2-1 fix: exit-code disambiguation and PR-number injection.
      #   exit 0 → PASS (verified all checks)
      #   exit 2 → REFUSED-BENIGN (post-merge / no PR — not a failure)
      #   exit 3 → FAIL (environment/auth failure — CI wrapper exits 1)
      #   exit 4 → FAIL (verifier self-diagnosed bug — CI wrapper exits 1)
      #   exit 5 → PARTIAL (some checks skipped — CI wrapper exits 1)
      #
      # PR number injection: on pull_request events github.event.pull_request.number
      # is available without GH_TOKEN.  Passing --pr N bypasses the gh-based
      # PR resolution so checks 1-7,9 run unauthenticated.  Check 8 (live PR
      # body) requires GH_TOKEN and SKIPS loudly (exit 5) per operator design.
      # On push events PR_NUMBER is empty and the verifier falls through to
      # gh-based resolution (exits 3 on auth failure, step fails advisory).
      #
      # B-5 / if: !cancelled() so this step runs even when spec validators fail.
      # Develop-ref guard: fetch the develop ref so rev-list develop..HEAD works.
      - name: Verify evidence figures (advisory)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          # Pull request number from the GitHub event payload (no GH_TOKEN needed).
          # Bypasses gh-based PR resolution: checks 1-7,9 run unauthenticated.
          # Empty string on push events (no pull_request in payload).
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=50 origin develop:refs/remotes/origin/develop 2>/dev/null || true
          git branch develop refs/remotes/origin/develop 2>/dev/null || true
          if ! git rev-parse --verify --quiet develop >/dev/null 2>&1; then
            echo "verify-evidence-figures: SKIPPED (develop ref unavailable in this checkout)"
            exit 0
          fi
          # Pass --pr N when available from the event context so gh auth is not
          # needed for PR resolution.  On push events PR_NUMBER is empty.
          PR_ARGS=()
          if [ -n "${PR_NUMBER:-}" ]; then
              PR_ARGS=("--pr" "${PR_NUMBER}")
          fi
          ret=0
          python3 scripts/verify-evidence-figures.py "${PR_ARGS[@]}" || ret=$?
          case $ret in
            0) echo "verify-evidence-figures: PASS" ;;
            2) echo "verify-evidence-figures: REFUSED (context not applicable — not a failure)" ;;
            3) echo "verify-evidence-figures: FAIL — environment/auth failure (exit 3)"; exit 1 ;;
            4) echo "verify-evidence-figures: FAIL — verifier self-diagnosed bug (exit 4)"; exit 1 ;;
            5) echo "verify-evidence-figures: PARTIAL — some checks skipped, not a full pass (exit 5)"; exit 1 ;;
            *) echo "verify-evidence-figures: FAIL (exit $ret)"; exit $ret ;;
          esac
