# CI pipeline for mdlinkcheck
#
# Runs on:
#   - Push to feature/**, fix/**, develop, main branches
#   - Pull requests targeting develop or main
#   - Manual dispatch (workflow_dispatch) for check-name validation runs
#
# Platform target per D-043 (operator directive, 2026-08-06):
#   macos-latest only — product targets macOS exclusively.
#   Platform-independent jobs (fmt, lint, spec-lint) remain on ubuntu-latest
#   for cost efficiency (~10x cheaper than macOS runners).
#
# All action versions pinned to full commit SHAs (supply-chain security).
# SHA verification command: gh api repos/OWNER/REPO/git/refs/tags/TAG
#
# SHA inventory (verify before enabling remote CI):
#   actions/checkout     v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
#   Swatinem/rust-cache  v2.7.5  82a92a6e8fbeee089604da2575dc567ae9ddeaab

name: CI

on:
  push:
    branches:
      - "feature/**"
      - "fix/**"
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:
    # Manual trigger for validation runs (e.g. to capture exact check-run names
    # before adding them to branch-protection required-status-checks).

# Cancel in-progress runs on PRs; keep all runs on branch pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege: only read the source tree.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Job 1: Format check (fast gate, no caching needed)
  # Local equivalent: just fmt-check
  # ─────────────────────────────────────────────────────────────────
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Cargo workspace present
        shell: bash
        run: |
          test -f Cargo.toml || { echo "FAIL: no Cargo workspace at repo root"; exit 1; }

      - name: Check formatting
        run: cargo fmt --all --check

  # ─────────────────────────────────────────────────────────────────
  # Job 2: Clippy (deny all warnings)
  # Local equivalent: just lint
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Cargo workspace present
        shell: bash
        run: |
          test -f Cargo.toml || { echo "FAIL: no Cargo workspace at repo root"; exit 1; }

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────────────────────────
  # Job 3: Tests — macOS-only per D-043
  # Local equivalent: just test
  #
  # D-043 (2026-08-06): product targets macOS exclusively.
  # Prior D-006 three-platform matrix (ubuntu/macos/windows) retired.
  # ─────────────────────────────────────────────────────────────────
  test:
    name: Test (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Cargo workspace present
        shell: bash
        run: |
          test -f Cargo.toml || { echo "FAIL: no Cargo workspace at repo root"; exit 1; }

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: test-macos-latest

      - name: Install cargo-nextest
        # Installed via cargo install so no action SHA is needed.
        # Cached by Swatinem/rust-cache (it caches ~/.cargo/bin).
        # Pin version here to keep reproducible builds.
        run: cargo install cargo-nextest --locked --version 0.9.98
        env:
          # Skip building nextest from scratch if the binary is already in cache.
          CARGO_TERM_COLOR: always

      - name: Run tests
        run: cargo nextest run --locked --all-targets

      - name: POL-11 positive-coverage assertion
        # Asserts test count and binary count meet required floors, preventing a
        # silent false-green where a test binary silently drops out of the run
        # (e.g. harness = false, wrong target path — both occurred in this story
        # as findings C-E2 and P14-03; the binary was hardened but the gate was
        # never added).  See architecture spec tooling-selection.md:155-160 (POL-11).
        #
        # NOTE: The frozen spec's literal command is:
        #   cargo nextest list | grep -c '^tests::'
        # That returns 0 in this project — nextest 0.9.98 (CI-pinned) uses the
        # indented format "    test_name"; neither format uses "^tests::" prefix.
        # The pattern below uses [[:space:]]+test_ which matches both the indented
        # 0.9.98 format and the flat "crate::binary test_name" format of 0.9.129+.
        # Raise POL11_TEST_FLOOR / POL11_BIN_FLOOR when tests or binaries are added.
        # Verified baseline: 44 tests across 6 binaries (2026-08-11).
        # PLATFORM-DEPENDENT: 44 is the count on unix. Three tests are #[cfg(unix)]
        # gated (scanner_discovery_tests.rs:472, :526, :1411), so a non-unix target
        # compiles 41 and this floor would report "test count 41 is below floor 44"
        # with the misleading "silently dropped out" diagnostic. Fails CLOSED, and
        # this job is macos-latest only per D-043, so no gate is compromised.
        shell: bash
        run: |
          set -euo pipefail
          # COUPLING: POL11_TEST_FLOOR and POL11_BIN_FLOOR are defined here and also
          # in the `test` recipe in justfile — both files must be updated together.
          POL11_TEST_FLOOR=44
          POL11_BIN_FLOOR=6
          # --color never: this workflow sets CARGO_TERM_COLOR=always in its top-level
          # env (line 47).  That causes `cargo nextest list` to inject ANSI escape
          # sequences between the leading whitespace and the test name, for example:
          #   "    \e[34;1mtest_foo\e[0m"
          # The pattern [[:space:]]+test_ then matches nothing and silently returns 0.
          # --color never overrides CARGO_TERM_COLOR in the subprocess, producing plain
          # text regardless of the outer env.  Applied to bin_count as well for
          # consistency and to guard against future format changes.
          test_count=$(cargo nextest list --locked --all-targets --color never 2>/dev/null | { grep -cE '[[:space:]]+test_' || true; })
          bin_count=$(cargo nextest list --locked --all-targets --list-type binaries-only --color never 2>/dev/null | wc -l | tr -d ' ')
          if [ "${test_count}" -lt "${POL11_TEST_FLOOR}" ]; then
            echo "POL-11 FAIL: test count ${test_count} is below floor ${POL11_TEST_FLOOR}"
            echo "  A test binary may have silently dropped out of the run."
            echo "  Raise POL11_TEST_FLOOR in ci.yml and justfile when new tests are added."
            exit 1
          fi
          if [ "${bin_count}" -lt "${POL11_BIN_FLOOR}" ]; then
            echo "POL-11 FAIL: binary count ${bin_count} is below floor ${POL11_BIN_FLOOR}"
            echo "  A test binary may have been lost."
            echo "  Raise POL11_BIN_FLOOR in ci.yml and justfile when new binaries are added."
            exit 1
          fi
          echo "POL-11 PASS: ${test_count} tests across ${bin_count} binaries (floors: ${POL11_TEST_FLOOR}/${POL11_BIN_FLOOR})"

  # ─────────────────────────────────────────────────────────────────
  # Job 4: Release build — macOS-only per D-043
  # Local equivalent: just build-release
  #
  # Verifies the binary links and compiles without errors on macOS.
  # Runs only after fmt + lint pass (avoids wasted runner-minutes).
  # D-043 (2026-08-06): prior ubuntu/windows matrix entries retired.
  # ─────────────────────────────────────────────────────────────────
  build-release:
    name: Build release (macos-latest)
    needs: [fmt, lint]
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verify Cargo workspace present
        shell: bash
        run: |
          test -f Cargo.toml || { echo "FAIL: no Cargo workspace at repo root"; exit 1; }

      - name: Restore Cargo cache
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: release-macos-latest

      - name: Build
        run: cargo build --locked --release

  # ─────────────────────────────────────────────────────────────────
  # Job 5: MSRV check — verify the workspace compiles on the declared MSRV
  # Local equivalent: just msrv-check
  #
  # Declared MSRV: 1.88.
  # Operator-authorized deviation from frozen spec value of 1.85 (D-205):
  # globset 0.4.20 and ignore 0.4.33 both require rustc 1.88, and the
  # F-A1/F-P2-01 dot-directory guard correctness argument is explicitly
  # grounded in ignore 0.4.33 behavior, so downgrading is not safe.
  # Deviation is disclosed in the PR body and wave-1 gate package.
  # ─────────────────────────────────────────────────────────────────
  msrv:
    name: MSRV check (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Guard — skip if no Cargo workspace
        id: guard
        shell: bash
        run: |
          if [ ! -f Cargo.toml ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No Cargo.toml found — workspace not yet scaffolded, skipping."
          fi

      - name: Install Rust 1.88 toolchain
        if: steps.guard.outputs.skip != 'true'
        run: rustup toolchain install 1.88 --profile minimal

      - name: Restore Cargo cache
        if: steps.guard.outputs.skip != 'true'
        uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # v2.7.5
        with:
          key: msrv-1.88-ubuntu-latest

      - name: MSRV check
        if: steps.guard.outputs.skip != 'true'
        run: cargo +1.88 check --all-targets --locked

  # ─────────────────────────────────────────────────────────────────
  # Job 6: Spec lint — validate spec artifact integrity (no Cargo needed)
  # Local equivalent: just spec-lint
  #
  # Pure-Python validators that require only the .factory/specs/ tree.
  # Runs independently of all Rust jobs so it works before the
  # workspace is scaffolded.  Failures are violations that MUST be
  # fixed before the Phase 1 gate passes.
  #
  # Covered policies: POL-7, POL-12, POL-13, POL-14, POL-15,
  #                   POL-16, POL-17, POL-18, POL-19
  # ─────────────────────────────────────────────────────────────────
  spec-lint:
    name: Spec lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level permissions: read-only source tree access.
    # Overrides workflow default to make the grant explicit per POL-11.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # B2-1 fix: on pull_request events check out the REAL PR head commit,
          # not the ephemeral merge ref GitHub synthesises by default.
          # The merge ref's SHA is generated by GitHub and can never appear in
          # any committed artifact, so SHA-based artifact discovery in
          # verify-evidence-figures.py always found 0 candidates → REFUSED
          # (exit 2) → "not a failure" — green having compared nothing.
          # With the real PR head SHA, the verifier sees the correct HEAD and
          # can match (or fail) against the committed pr-description.md.
          # On push/workflow_dispatch events pull_request.head.sha is empty;
          # github.sha provides the pushed commit SHA as fallback.
          # fetch-depth: 0 (full history) so git rev-list develop..HEAD
          # resolves correctly in the advisory step — shallow clones break it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout spec artifacts (factory-artifacts orphan branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: factory-artifacts
          path: .factory
          persist-credentials: false
          fetch-depth: 1

      - name: Run spec validators
        shell: bash
        run: |
          set -euo pipefail
          CHECKS=(
            "check-title-sync"
            "check-ec-injectivity"
            "check-id-resolution"
            "check-counts"
            "check-placeholders"
            "check-holdout-boundary"
            "check-adr-consistency"
            "check-index-integrity"
            "check-canonical-facts"
          )
          FAILURES=0
          for check in "${CHECKS[@]}"; do
            echo "── ${check} ──"
            ret=0
            python3 "scripts/spec-lint/${check}.py" || ret=$?
            case $ret in
              0)
                echo "  PASS" ;;
              2)
                echo "  ERROR (infrastructure — required input files missing)"
                FAILURES=$((FAILURES + 1)) ;;
              *)
                echo "  FAIL (spec violation found)"
                FAILURES=$((FAILURES + 1)) ;;
            esac
            echo ""
          done
          if [ "${FAILURES}" -gt 0 ]; then
            echo "spec-lint FAILED: ${FAILURES}/${#CHECKS[@]} checks failed"
            exit 1
          fi
          echo "spec-lint passed: all ${#CHECKS[@]} checks clean"

  # ─────────────────────────────────────────────────────────────────
  # Job 7: Purity check — ADR-001 boundary enforcement for mdlinkcheck-core
  # Local equivalent: just purity
  #
  # Scans crates/mdlinkcheck-core/src/ for forbidden import patterns
  # (std::fs, std::net, std::io::stdout, std::time::Instant, RNG).
  # cargo-deny inspects the dependency graph, not source-level std imports,
  # so this check fills the gap that cargo-deny cannot fill.
  # Runs on every PR as an erosion gate for the 7 downstream stories.
  # NOT a required status check (branch-protection unchanged; operator-gated).
  # ─────────────────────────────────────────────────────────────────
  purity:
    name: Purity check (ADR-001)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check mdlinkcheck-core purity (ADR-001)
        shell: bash
        # Delegates to scripts/purity-check.sh — the SINGLE implementation,
        # shared with the `purity` recipe in the justfile.
        #
        # BI-090: this step and that recipe previously carried two
        # hand-maintained copies of the detector. Keeping them byte-identical was
        # a standing obligation that produced defects in three consecutive review
        # rounds (BI-081; then P22-01/P23-01/P24-01 multi-line blindness plus an
        # inverted fs/net-vs-stdout/Instant asymmetry; then P24-02 self-check arm
        # masking). One file closes the duplication class by construction.
        # Do NOT re-inline the detector here.
        run: ./scripts/purity-check.sh

  # ─────────────────────────────────────────────────────────────────
  # Job 8 (formerly 7): VEF selftest suite — own job for honest conclusion (M-5)
  # Local equivalent: python3 scripts/tests/test-vef.py
  #
  # WHY THIS IS ITS OWN JOB — do NOT merge back into spec-lint (M-5):
  #   test-vef.py previously ran as a step inside spec-lint, whose job
  #   conclusion is already 'failure' by D-128 design (known develop
  #   violations the verifier must not fix).  A genuine verifier-suite
  #   regression is therefore unattributable at check-status level —
  #   L-66's defect in operational form (the identical defect D-212
  #   exists to fix, left half-applied).
  #
  #   In its own job — no continue-on-error at step or job level —
  #   a failing test-vef.py produces a failing job conclusion visible
  #   at check-status level.  Spec-lint retains its own advisory
  #   failure (D-128 preserved).
  #
  # Event scope: no github.event_name gate — test-vef.py requires no
  #   gh authentication and is meaningful on both push and pull_request.
  #   Unlike verify-evidence-figures (which needs a PR number), this
  #   job validates the verifier binary itself, always runnable.
  #
  # Not a required status check (D-117/D-120/D-122/D-133 preserved).
  # ─────────────────────────────────────────────────────────────────
  vef-selftest:
    name: VEF selftest suite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !cancelled() }}
    # Least-privilege: read-only source tree.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run VEF selftest suite
        shell: bash
        run: |
          ret=0
          python3 scripts/tests/test-vef.py || ret=$?
          case $ret in
            0) echo "VEF selftest: PASS (all tests verified)" ;;
            5) echo "VEF selftest: PARTIAL (T17/T18 loud-skip — gh auth unavailable; verifier logic tests all pass)" ;;
            *) echo "VEF selftest: FAIL (exit $ret — verifier is broken)"; exit $ret ;;
          esac

  # ─────────────────────────────────────────────────────────────────
  # Job 9 (formerly 8): Evidence-figure verifier — own job for conclusion honesty
  # Local equivalent: python3 scripts/verify-evidence-figures.py
  #
  # WHY THIS IS ITS OWN JOB — do NOT merge back into spec-lint:
  #   When the verifier lived as a step in spec-lint it required
  #   continue-on-error: true so spec-lint's conclusion was not
  #   affected by an advisory failure.  But continue-on-error causes
  #   GitHub to record the step "outcome" as "failure" while its
  #   "conclusion" becomes "success", leaving the job result clean
  #   regardless of what the verifier returned.  Every failure path
  #   (exit 1, 3, 4, 5) was neutralised at the conclusion level —
  #   L-66 verbatim: "continue-on-error: true makes CONCLUSION
  #   structurally incapable of signalling failure."
  #
  #   In its own job — with no continue-on-error at either step or
  #   job level (job-level continue-on-error would reintroduce the
  #   same masking one level up) — a failing verifier produces a
  #   failing job conclusion visible in the GitHub UI and CI logs.
  #
  #   This job is NOT a required status check.  The REQUIRED flip is
  #   operator-gated per D-117/D-120/D-122/D-133 and no branch-
  #   protection change is made here.  An advisory failing conclusion
  #   does not block merges (D-120 preserved).  spec-lint keeps its
  #   own conclusion and its three known advisory failures on develop
  #   remain advisory (D-128 preserved).
  #
  # Covered decisions: D-212 (L-66 fix), B2-1, B-5, S2-3
  # ─────────────────────────────────────────────────────────────────
  verify-evidence-figures:
    name: Verify evidence figures (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to pull_request events: the verifier's purpose is comparing a PR's
    # evidence figures against that PR, so non-PR events have nothing to verify.
    # This is a genuine scope condition, not a suppression — on push events there
    # is no PR number available, so the verifier cannot do its job.
    # !cancelled() preserved so the job still runs even when other jobs fail
    # (B-5 fix — do not regress it).  No needs: dependency — runs in parallel.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    # Least-privilege: read-only source tree.  No GH_TOKEN grant (D-203).
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # B2-1: check out the real PR head, not GitHub's ephemeral merge ref,
          # so SHA-based artifact discovery in verify-evidence-figures.py sees
          # the correct HEAD commit.  github.sha fallback is unreachable in CI
          # (job is pull_request-only) but retained for local/manual invocation.
          # fetch-depth: 0 so git rev-list develop..HEAD resolves correctly —
          # shallow clones break it.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Checkout spec artifacts (factory-artifacts orphan branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: factory-artifacts
          path: .factory
          persist-credentials: false
          fetch-depth: 1

      - name: Verify evidence figures
        shell: bash
        env:
          # Pull request number from the GitHub event payload (no GH_TOKEN needed).
          # Bypasses gh-based PR resolution: checks 1-7,9 run unauthenticated.
          # Check 8 (live PR body) requires GH_TOKEN and skips loudly (exit 5)
          # per operator design (D-203).
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=50 origin develop:refs/remotes/origin/develop 2>/dev/null || true
          git branch develop refs/remotes/origin/develop 2>/dev/null || true
          if ! git rev-parse --verify --quiet develop >/dev/null 2>&1; then
            # LOUD-SKIP: develop ref unavailable after fetch attempt.
            # Exit 5 (PARTIAL/loud-skip) — consistent with the existing scheme
            # where exit 5 means "not a full pass; some checks could not run."
            # Exit 0 here would be indistinguishable from a successful run to
            # any consumer reading the exit code.
            echo "verify-evidence-figures: LOUD-SKIP (develop ref unavailable in this checkout)"
            echo "  Exit 5 signals PARTIAL — this cannot be read as a pass."
            exit 5
          fi
          PR_ARGS=()
          if [ -n "${PR_NUMBER:-}" ]; then
              PR_ARGS=("--pr" "${PR_NUMBER}")
          fi
          ret=0
          python3 scripts/verify-evidence-figures.py "${PR_ARGS[@]}" || ret=$?
          case $ret in
            0) echo "verify-evidence-figures: PASS" ;;
            2)
              # B2-1 closure: exit 2 (REFUSED-benign) is not acceptable on a PR.
              # Validated against the code path in verify-evidence-figures.py that
              # produces exit 2: REFUSED means zero checks ran — gate is green
              # having compared nothing.  We reject all exit-2 on PRs regardless
              # of which REFUSED reason triggered it.
              # Note: the else branch below is unreachable in CI (job is scoped to
              # pull_request events) but retained for local/manual invocation.
              if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
                echo "verify-evidence-figures: FAIL — REFUSED on pull_request event"
                echo "  (gate must reach comparisons on every PR;"
                echo "   REFUSED means zero checks ran — gate is green having compared nothing)"
                exit 1
              else
                echo "verify-evidence-figures: REFUSED (context not applicable — not a failure)"
              fi
              ;;
            3) echo "verify-evidence-figures: FAIL — environment/auth failure (exit 3)"; exit 1 ;;
            4) echo "verify-evidence-figures: FAIL — verifier self-diagnosed bug (exit 4)"; exit 1 ;;
            5) echo "verify-evidence-figures: PARTIAL — some checks skipped, not a full pass (exit 5)"; exit 1 ;;
            *) echo "verify-evidence-figures: FAIL (exit $ret)"; exit $ret ;;
          esac
